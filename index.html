<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="CUMA GARIS. — Episode Interaktif. Tonton episode anime ±1 menit, lalu mainkan duel Raka sebagai penentu endingnya." />
  <title>CUMA GARIS. — Episode Interaktif</title>

  <!-- Pra-koneksi CDN Three.js (dipakai Fase 3) -->
  <link rel="preconnect" href="https://unpkg.com" />

  <link rel="stylesheet" href="src/style.css" />
</head>
<body>

<div id="app">

  <!-- Latar dekoratif desktop — sisi kiri/kanan panggung (via CSS ::before) -->

  <!-- ======================================================
       PANGGUNG 9:16 — satu-satunya elemen bermain
       ====================================================== -->
  <div class="stage" role="main" aria-label="Panggung episode CUMA GARIS.">

    <!-- ---- Area klip video -------------------------------- -->
    <div id="clip-area">
      <!-- Elemen video utama; src diisi scenePlayer -->
      <video id="main-video"
             playsinline
             muted
             preload="metadata"
             aria-label="Klip adegan episode">
      </video>

      <!-- Fallback: ditampilkan bila klip gagal muat (Req 1.4) -->
      <div id="clip-fallback" role="img" aria-label="Gambar cadangan adegan">
        <span id="clip-fallback-text">[ Scene unavailable — the narration continues ]</span>
      </div>

      <!-- ---- Overlay subtitle (Req 2.2) ------------------- -->
      <div id="subtitle-overlay" aria-live="polite" aria-atomic="true">
        <span id="subtitle-text"></span>
      </div>

      <!-- ---- Indikator scene (Req 1.2) -------------------- -->
      <div id="scene-indicator" role="list" aria-label="Indikator scene saat ini">
        <!-- Titik-titik diisi dinamis oleh scenePlayer via JS -->
      </div>

      <!-- ---- Overlay stub BRANCH/DUEL/ENDING/ENDCARD ------- -->
      <!-- dibuat dinamis oleh stubs.js; elemen placeholder di sini
           agar CSS bisa menargetnya sebelum JS berjalan -->
      <div id="stub-overlay" style="display:none;" role="dialog" aria-modal="true"></div>

      <!-- ---- Layar intro ----------------------------------- -->
      <div id="intro-screen" role="region" aria-label="Layar pembuka episode">
        <h1>CUMA <span>GARIS.</span></h1>
        <p class="intro-series" id="intro-series">Episode 1 — "Woke Up as a Line"</p>
        <p class="intro-sub" id="intro-sub">An interactive anime episode, ±1 minute</p>
        <button id="btn-start" type="button">▶ Start Episode</button>
      </div>
    </div><!-- /#clip-area -->

    <!-- ---- Kontrol bawah panggung (Req 1.5, 5.3) ---------- -->
    <div id="controls" role="toolbar" aria-label="Kontrol pemutar">

      <!-- Progress bar (Req 1.2) -->
      <div id="progress-bar-wrap"
           role="progressbar"
           aria-valuemin="0"
           aria-valuemax="100"
           aria-valuenow="0"
           aria-label="Progres episode">
        <div id="progress-bar-fill"></div>
      </div>

      <!-- Tombol aksi — target sentuh ≥ 48 px (Req 5.3) -->
      <div id="control-buttons">
        <button id="btn-play"
                class="ctrl-btn"
                type="button"
                aria-label="Jeda / Lanjut (Spasi)"
                disabled>
          ⏸
        </button>

        <button id="btn-skip"
                class="ctrl-btn"
                type="button"
                aria-label="Lewati scene ini"
                disabled>
          ⏭
        </button>

        <!-- Toggle bahasa subtitle ID/EN (Fase 6) -->
        <button id="btn-lang"
                class="ctrl-btn lang-btn"
                type="button"
                aria-label="Subtitle language: English / Indonesian"
                aria-pressed="false">
          EN
        </button>

        <!-- Tombol mute didorong ke kanan -->
        <button id="btn-mute"
                class="ctrl-btn"
                type="button"
                aria-label="Bisukan / Pulihkan suara"
                aria-pressed="false">
          🔊
        </button>
      </div>

    </div><!-- /#controls -->

  </div><!-- /.stage -->

</div><!-- /#app -->

<!-- Three.js via CDN — dimuat oleh modul duel di Fase 3 -->
<!-- <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }</script> -->

<script type="module" src="src/main.js"></script>
</body>
</html>
